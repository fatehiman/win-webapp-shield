name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish everything
        shell: pwsh
        run: ./build.ps1 -AppName mstodo

      - name: Round-trip the encryption
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path plain.conf -Value '{ "url": "https://example.com" }' -Encoding utf8
          $before = Get-Content plain.conf -Raw

          ./dist/encode.exe "plain.conf" "Kopolop0_90u"
          if ($LASTEXITCODE -ne 0) { throw 'encode.exe failed' }

          $bytes = [System.IO.File]::ReadAllBytes('plain.conf')
          $magic = [System.Text.Encoding]::ASCII.GetString($bytes, 0, 7)
          if ($magic -ne 'WASENC1') { throw "expected the WASENC1 header, found '$magic'" }

          ./dist/decode.exe "plain.conf" "Kopolop0_90u"
          if ($LASTEXITCODE -ne 0) { throw 'decode.exe failed' }

          $after = Get-Content plain.conf -Raw
          if ($before -ne $after) { throw 'the round trip changed the file' }

          ./dist/decode.exe "plain.conf" "wrong-password" "should-not-exist.conf"
          if ($LASTEXITCODE -eq 0) { throw 'a wrong password should not succeed' }

          Write-Host 'encryption round trip ok'
          # The wrong-password call above left $LASTEXITCODE at 3 on purpose. pwsh
          # steps report that as the step result, so clear it deliberately.
          exit 0

      - name: Check the icon builder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # SVG path: exercises paths with arcs, rects, circles, ellipses, polygons,
          # groups with transforms, and linear and radial gradients.
          ./tools/make-app-icon.ps1 -Source ./tools/test-assets/sample-logo.svg -Out out/from-svg.ico
          if (-not (Test-Path out/from-svg.ico)) { throw 'no .ico was produced from the SVG' }

          $bytes = [System.IO.File]::ReadAllBytes('out/from-svg.ico')
          if ([System.BitConverter]::ToUInt16($bytes, 2) -ne 1) { throw 'the file is not an icon' }
          $count = [System.BitConverter]::ToUInt16($bytes, 4)
          if ($count -ne 9) { throw "expected 9 sizes in the .ico, found $count" }

          # Raster path, and it must also accept an .ico as input.
          ./tools/make-app-icon.ps1 -Source out/from-svg.ico -Out out/from-ico.ico -Sizes 16,32,48,256
          $count = [System.BitConverter]::ToUInt16([System.IO.File]::ReadAllBytes('out/from-ico.ico'), 4)
          if ($count -ne 4) { throw "expected 4 sizes, found $count" }

          # A build that compiles an icon into the exe must actually change it.
          ./build.ps1 -AppName icontest -AppIcon out/from-svg.ico
          Add-Type -AssemblyName System.Drawing
          $wrapped = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path dist/icontest.exe).Path).ToBitmap()
          $generic = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path dist/webappshield.exe).Path).ToBitmap()
          $same = $true
          for ($y = 0; $y -lt $wrapped.Height -and $same; $y++) {
            for ($x = 0; $x -lt $wrapped.Width; $x++) {
              if ($wrapped.GetPixel($x, $y) -ne $generic.GetPixel($x, $y)) { $same = $false; break }
            }
          }
          if ($same) { throw 'icontest.exe carries the same icon as webappshield.exe, so -AppIcon did nothing' }

          $iconLine = (Select-String -Path dist/icontest.conf -Pattern '^\s*"icon"').Line
          if ($iconLine -notmatch 'icontest\.ico') { throw "the generated conf was not pointed at the icon: $iconLine" }
          if (-not (Test-Path dist/icontest.ico)) { throw 'the .ico was not copied next to the exe' }

          Remove-Item dist/icontest.exe, dist/icontest.conf, dist/icontest.ico -Force
          Write-Host 'icon builder ok'
          exit 0

      - name: Smoke test the wrapper
        # Starts the real exe with 18 different .conf files and reads back what
        # Windows created. The hosted runner does give a usable desktop session,
        # so all 65 fast checks run here. The sleep/wake test (-IncludeSlow) takes
        # minutes of real waiting and is left for a local run before a release.
        shell: pwsh
        run: ./tools/smoke-test.ps1

      - name: Check that setup.exe detects the runtime
        shell: pwsh
        run: |
          ./dist/setup.exe --silent
          if ($LASTEXITCODE -ne 0) { throw 'setup.exe reported a problem' }
          exit 0

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: win-webapp-shield-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish everything
        shell: pwsh
        run: ./build.ps1

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "win-webapp-shield-${{ github.ref_name }}-win-x64.zip"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: win-webapp-shield-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
