// =============================================================================
//  mstodo.conf  -  configuration for mstodo.exe
// =============================================================================
//
//  HOW THE FILE IS FOUND
//    The exe looks for a file with its own name and the .conf extension, in its
//    own folder. mstodo.exe  ->  mstodo.conf
//    If the file is missing, the app shows an error box and closes.
//
//  COMMENTS
//    // line comments and /* block comments */ are allowed.
//    A comma after the last item is allowed too.
//    Single quotes are NOT allowed. Use "double quotes" for text.
//
//  ENCRYPTION
//    You may encrypt this file so users cannot read it:
//        encode.exe "mstodo.conf" "Kopolop0_90u"
//    Back to plain text:
//        decode.exe "mstodo.conf" "Kopolop0_90u"
//    The app reads both forms. It looks at the first bytes of the file and
//    decrypts only when needed.
//
//  In every section below, the line that is active is the one WITHOUT "//".
//  The other possible values are listed under it, commented out.
// =============================================================================
{

  // ---------------------------------------------------------------------------
  // A) url  -  the page to open at startup
  // ---------------------------------------------------------------------------
  // Must be a full address including http:// or https://.
  // file:/// also works if you want to show a local page.
  "url": "https://to-do.office.com/tasks/",
  // "url": "https://outlook.office.com/mail/",
  // "url": "file:///C:/apps/mstodo/offline.html",


  // ---------------------------------------------------------------------------
  // B) width / height  -  size of the window at startup, in real pixels
  // ---------------------------------------------------------------------------
  // These are device pixels, not scaled by the Windows display scaling.
  // Allowed range: 100 .. 30000.
  "width": 1100,
  "height": 820,


  // ---------------------------------------------------------------------------
  // C) monitor  -  which screen the window opens on
  // ---------------------------------------------------------------------------
  // 0 = the default (primary) monitor
  // 1 = "Display 1" in Windows Settings, 2 = "Display 2", and so on.
  // If that monitor does not exist or cannot be detected, the primary monitor
  // is used instead. Nothing fails.
  "monitor": 0,
  // "monitor": 1,
  // "monitor": 2,


  // ---------------------------------------------------------------------------
  // D) window-type  -  title bar and its buttons
  // ---------------------------------------------------------------------------
  // ""  = no title bar at all. No caption, no buttons. The window can still be
  //       resized by dragging its edges, but it cannot be dragged around.
  //
  // Anything else = a normal Windows title bar, plus the buttons you list.
  // Tags, joined with "+" in any order:
  //   min    show the Minimize button
  //   max    show the Maximize button
  //   close  the X button works and closes/hides the window
  //   tray   put an icon in the notification area (system tray)
  //
  // Notes:
  //   * The order you write the tags does not matter. Windows always draws the
  //     buttons in its own standard order and style.
  //   * If "close" is missing, Windows draws a real greyed out X and Alt+F4 is
  //     blocked. Use the tray menu Exit to quit in that case.
  //   * If "tray" is present, the tray icon is on even when "systray" is false.
  "window-type": "min+max+close+tray",
  // "window-type": "",                 // frameless
  // "window-type": "min+close",        // no maximize
  // "window-type": "close",            // only the X
  // "window-type": "min+max+close",    // a normal window, no tray icon
  // "window-type": "min+tray",         // no X at all, quit from the tray menu


  // ---------------------------------------------------------------------------
  // E) position  -  where the window appears at startup
  // ---------------------------------------------------------------------------
  // "center"  centre of the chosen monitor
  // "last"    the position the user left it at last time. It is stored in
  //           mstodo.session next to the exe. If that file cannot be written
  //           (read only folder) the app silently falls back to "center".
  // "x,y"     an exact spot, measured from the top left corner of the chosen
  //           monitor's working area, e.g. "40,40".
  "position": "center",
  // "position": "last",
  // "position": "40,40",


  // ---------------------------------------------------------------------------
  // F) window-state  -  how the window starts
  // ---------------------------------------------------------------------------
  // "normal"  a normal window
  // "min"     minimized to the taskbar
  // "max"     maximized
  // "tray"    hidden in the notification area. The window is never drawn, not
  //           even for a moment, and the embedded browser is not started until
  //           the user opens it. This is the lightest way to start.
  "window-state": "normal",
  // "window-state": "min",
  // "window-state": "max",
  // "window-state": "tray",


  // ---------------------------------------------------------------------------
  // G) icon  -  .ico file for the window, the taskbar and the tray
  // ---------------------------------------------------------------------------
  // Relative paths are resolved from the exe folder.
  // Leave it "" to use the icon built into the exe.
  // A missing or broken file is ignored, it never stops the app.
  "icon": "app.ico",
  // "icon": "icons\\mstodo.ico",
  // "icon": "C:\\apps\\icons\\mstodo.ico",
  // "icon": "",


  // ---------------------------------------------------------------------------
  // H) systray  -  show an icon in the notification area
  // ---------------------------------------------------------------------------
  // true / false.
  // If any other setting needs the tray ("tray" in window-type, or
  // window-state "tray"), the tray is switched on even if this says false.
  "systray": true,
  // "systray": false,


  // ---------------------------------------------------------------------------
  // I) title  -  text on the title bar and on the tray tooltip
  // ---------------------------------------------------------------------------
  // Leave it "" to use the exe file name.
  "title": "Microsoft To Do",
  // "title": "",


  // ---------------------------------------------------------------------------
  // J) tray-open-in-browser  -  extra item in the tray right click menu
  // ---------------------------------------------------------------------------
  // The menu always has "Open" and "Exit".
  // Set this to true to also get "Open in browser", which opens the current
  // page in the default Windows browser.
  "tray-open-in-browser": true,
  // "tray-open-in-browser": false,


  // ---------------------------------------------------------------------------
  // K) sleep-after  -  give memory back while the window is out of sight
  // ---------------------------------------------------------------------------
  // Embedded browsers use a lot of memory. After the window has been minimized
  // or hidden in the tray for this long, the app shuts the embedded browser
  // down completely and hands the memory back to Windows. When the user opens
  // the window again, the browser is started and the same page is loaded.
  //
  // A window that is open on the desktop is NEVER put to sleep, even if the
  // user does not touch it.
  //
  // "auto"  look at the free memory of the machine:
  //           less than 20% free  ->  sleep after 10 minutes
  //           20% or more free    ->  sleep after 120 minutes
  // number  minutes of being out of sight, e.g. 120 means 2 hours
  // "off"   never sleep
  "sleep-after": "auto",
  // "sleep-after": 30,
  // "sleep-after": 120,
  // "sleep-after": "off",


  // ===========================================================================
  //  Extra settings. All of them have a sensible default, so you may delete
  //  every line below and the app still works.
  // ===========================================================================

  // What the X button does. Only matters when the tray is on.
  // "auto"  tray is on  -> hide to the tray (how most tray apps behave)
  //         tray is off -> quit the app
  // "tray"  always hide to the tray
  // "exit"  always quit
  "close-action": "auto",
  // "close-action": "tray",
  // "close-action": "exit",

  // Can the user resize the window by dragging its edges?
  "resizable": true,
  // "resizable": false,

  // Keep the window above all other windows.
  "always-on-top": false,
  // "always-on-top": true,

  // When the tray is on: does the Minimize button also hide the window into the
  // tray? false means Minimize goes to the taskbar as usual.
  // Note: while this is true, "window-state": "min" also ends up in the tray,
  // because the window starts minimized and is then hidden. Use false if you want
  // a taskbar button at startup.
  "minimize-to-tray": true,
  // "minimize-to-tray": false,

  // With "position": "last", also restore the size the user left the window at.
  "remember-size": true,
  // "remember-size": false,

  // Page zoom. 1.0 is 100%. Allowed range 0.25 .. 5.0.
  "zoom": 1.0,
  // "zoom": 1.25,

  // Replace the browser User-Agent string. "" keeps the Edge default, which is
  // what most sites expect. Only change it if a site refuses to load.
  "user-agent": "",
  // "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",

  // What happens when the user starts the SAME exe file a second time.
  // "error"  show a message box and close the new copy
  // "focus"  quietly bring the window that is already running to the front
  //
  // Two copies of the exe in two different folders are two different apps and
  // can always run at the same time. This setting is only about one exact file.
  "single-instance-action": "error",
  // "single-instance-action": "focus",

  // Open links that lead to a different site in the default Windows browser,
  // instead of inside this window. Handy for "Privacy policy" style links.
  "external-links-in-browser": false,
  // "external-links-in-browser": true,

  // Right click menu of the web page (Copy, Paste, Reload ...).
  "context-menu": true,
  // "context-menu": false,

  // F12 developer tools. Keep it false for normal users.
  "dev-tools": false,
  // "dev-tools": true,

  // Where the browser stores cookies, logins and cache.
  // ""  = %LOCALAPPDATA%\WinWebAppShield\<exename>-<hash of the exe path>
  //       Two copies in two folders keep separate logins.
  // Or give a folder. A relative path is resolved from the exe folder, which is
  // useful for a portable install on a USB stick.
  "data-dir": "",
  // "data-dir": "browser-data",
  // "data-dir": "C:\\apps\\mstodo\\browser-data",

  // Folder of a "fixed version" WebView2 runtime, if you ship one next to the
  // exe instead of using the runtime installed in Windows. The folder must
  // contain msedgewebview2.exe. "" = use the installed runtime.
  "webview2-path": "",
  // "webview2-path": "webview2-runtime",

  // Extra command line switches for the embedded browser. Leave "" unless you
  // know you need one.
  "webview2-args": ""
  // "webview2-args": "--disable-features=msWebOOUI,msPdfOOUI"

}
